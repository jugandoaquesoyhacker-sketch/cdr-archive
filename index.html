<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swiss CDR Ecosystem: Challenges and Ideas Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#D20F53; --env:#A9A9A9; --card:#FFFFFF; --ink:#3A3A3A; --muted:#747474;
  --idea:#C7D5ED; --idea-ink:#1F5E99; --idea-strong:#9FB6DD;
  --ch:#DCEDD5; --ch-ink:#3A7D22; --ch-strong:#B8DAA9;
  --page:#FFFFFF; --beam:rgba(0,0,0,.07); --tag:#BDBDBD; --label:#FFFFFF;
  --shadow:0 6px 22px rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --crimson:#FF4F86; --env:#3B3B3B; --card:#232323; --ink:#EDEDED; --muted:#B3B3B3;
    --idea:#2A3A55; --idea-ink:#9CC3F2; --idea-strong:#3B5683;
    --ch:#2C4126; --ch-ink:#9BD685; --ch-strong:#3F6235;
    --page:#161616; --beam:rgba(255,255,255,.05); --tag:#4A4A4A; --label:#F2F2F2;
    --shadow:0 6px 22px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --crimson:#FF4F86; --env:#3B3B3B; --card:#232323; --ink:#EDEDED; --muted:#B3B3B3;
  --idea:#2A3A55; --idea-ink:#9CC3F2; --idea-strong:#3B5683;
  --ch:#2C4126; --ch-ink:#9BD685; --ch-strong:#3F6235;
  --page:#161616; --beam:rgba(255,255,255,.05); --tag:#4A4A4A; --label:#F2F2F2;
  --shadow:0 6px 22px rgba(0,0,0,.5);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--crimson);outline-offset:3px}
h1[tabindex="-1"]:focus{outline:none}
svg.lucide{width:1em;height:1em;flex:none}

.wrap{max-width:1240px;margin:0 auto;padding:18px 22px 40px;position:relative}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo-crb{height:44px;width:auto}
.logo-ib{height:58px;width:58px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-crb{filter:brightness(1.6) contrast(.9)}}
:root[data-theme="dark"] .logo-crb{filter:brightness(1.6) contrast(.9)}

h1{font-size:clamp(1.35rem,2.6vw,2rem);font-weight:700;text-align:center;margin:6px 0 22px;letter-spacing:-.01em}
h1 .accent{color:var(--crimson)}

/* ---------- chips ---------- */
.chips{display:flex;flex-direction:column;gap:7px;width:100%;align-items:center}
.chip{display:flex;align-items:center;gap:8px;width:100%;max-width:150px;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.86rem;font-weight:500;text-decoration:none;transition:background .15s}
.chip .q{font-weight:900;width:14px;text-align:center}
.chip .n{margin-left:auto;font-size:.74rem;font-weight:700;background:var(--card);border-radius:999px;min-width:22px;padding:0 6px;text-align:center}
.chip.ch{background:var(--ch);color:var(--ch-ink)}
.chip.ch:hover,.chip.ch.on{background:var(--ch-strong)}
.chip.idea{background:var(--idea);color:var(--idea-ink)}
.chip.idea:hover,.chip.idea.on{background:var(--idea-strong)}

/* ---------- overview ---------- */
.env{background:var(--env);border-radius:70px;padding:16px 30px 30px}
.ring{color:var(--label);text-align:center;font-size:1.5rem;margin:0 0 10px}
.ov{display:grid;grid-template-columns:200px 1fr 200px;grid-template-areas:"l chain r" "b b b";gap:24px 28px;align-items:center}
.side{display:flex;flex-direction:column;gap:22px}
.ov .l{grid-area:l}.ov .r{grid-area:r}
.chain{grid-area:chain;background:var(--crimson);border-radius:60px;padding:22px 26px 10px}
.chain-row{display:flex;justify-content:center;gap:22px;position:relative;padding-top:92px}
.arrow{position:absolute;left:8%;right:8%;top:20px;height:16px;background:rgba(255,255,255,.4)}
.arrow::after{content:"";position:absolute;right:-24px;top:-10px;border-left:26px solid rgba(255,255,255,.4);border-top:18px solid transparent;border-bottom:18px solid transparent}
.chain-row .cat{position:relative}
.chain-row .cat::before{content:"";position:absolute;left:50%;top:-66px;width:2px;height:66px;background:rgba(255,255,255,.85);transform:translateX(-50%)}
.marker{position:absolute;left:50%;top:-84px;transform:translateX(-50%);width:34px;height:34px;border-radius:7px;background:#fff;color:#D20F53;display:grid;place-items:center;font-size:20px}
.bottom{grid-area:b;display:flex;justify-content:center;gap:28px;flex-wrap:wrap}

.cat{width:200px;height:168px;background:var(--card);border-radius:38px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:var(--shadow)}
.cat h2{margin:0;font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:7px;line-height:1.15;text-align:left;min-height:2.3em}
.cat h2 svg{font-size:1.2rem}
.chain .cat h2{color:var(--crimson);justify-content:center}
.chain .cat h2 svg{display:none}

/* ---------- sub pages ---------- */
.sub{display:grid;grid-template-columns:190px 1fr;gap:0 70px;align-items:start;position:relative;margin-top:30px;min-height:330px}
.sub .cat{width:170px;height:auto;padding:20px 14px;z-index:2;position:relative;margin-top:90px}
.panel-wrap{position:relative;z-index:1}
.sub-title{font-size:clamp(1.3rem,2.4vw,1.75rem);font-weight:700;margin:0 0 12px 40px}
.sub-title.idea span{color:var(--idea-ink)}
.sub-title.ch span{color:var(--ch-ink)}
.panel{background:var(--card);border-radius:60px;padding:26px 40px 34px;box-shadow:var(--shadow);min-height:280px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:flex-start;gap:12px;border-radius:999px;padding:9px 20px;font-size:.98rem;text-decoration:none}
.item.idea{background:var(--idea);color:var(--ink);transition:background .15s}
.item.idea:hover{background:var(--idea-strong)}
.item.idea svg{color:var(--idea-ink);margin-top:3px}
.item.idea .go{display:flex}
.item.idea .go{margin-left:auto;align-self:center}
.item.ch{background:var(--ch);color:var(--ink)}
.item.ch .q{color:var(--ch-ink);font-weight:900}
.item b{font-weight:700}
.empty{color:var(--muted);padding:12px 4px}

/* ---------- idea detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px 56px;margin-top:20px;align-items:start}
.d-title svg{margin-top:.12em}
.d-title.long{font-size:clamp(1.3rem,2.4vw,1.7rem)}
.d-title{grid-column:1/-1;display:flex;align-items:flex-start;gap:12px;text-align:left;line-height:1.2;font-size:clamp(1.5rem,3vw,2.15rem);font-weight:700;color:var(--idea-ink);margin:0}
.d-meta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.cohort{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;font-size:1.05rem}
.cohort svg{font-size:1.3rem}
.cat-pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--crimson);font-weight:700;border-radius:999px;padding:9px 18px;box-shadow:var(--shadow);text-decoration:none;font-size:.95rem}
.qcard{background:var(--card);border-radius:36px;padding:26px 28px;box-shadow:var(--shadow)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;background:var(--tag);color:#fff;border-radius:999px;padding:5px 18px;font-size:.88rem}
.question{font-weight:700;font-size:1.12rem;line-height:1.35;margin:16px 0 30px;color:var(--ink)}
.team{display:flex;align-items:center;gap:16px}
.team img{width:72px;height:auto}
.team .who{font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.team .who svg{font-size:1.2rem;display:block}
.weblink{display:flex;width:max-content;color:var(--ink);margin-bottom:4px}
.weblink:hover{color:var(--crimson)}
.desc{font-size:.97rem;line-height:1.75;text-align:justify;hyphens:auto;max-width:70ch}
.desc p{margin:0 0 1.2em}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--idea-ink);font-weight:500;text-decoration:none;font-size:.9rem;margin-top:20px}

.home{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;margin:36px 0 0 auto;background:var(--card);color:var(--crimson);border-radius:999px;padding:9px 18px;text-decoration:none;font-weight:500;box-shadow:var(--shadow)}
.home[hidden]{display:none}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .ov{grid-template-columns:1fr;grid-template-areas:"chain" "l" "r" "b"}
  .side{flex-direction:row;justify-content:center;flex-wrap:wrap}
}
@media (max-width:760px){
  .env{border-radius:40px;padding:14px 14px 22px}
  .chain{border-radius:36px;padding:16px}
  .chain-row{flex-direction:column;align-items:center;padding-top:0}
  .arrow,.marker,.chain-row .cat::before{display:none}
  .chain .cat h2 svg{display:inline}
  .cat{width:100%;max-width:320px}
  .sub{grid-template-columns:1fr;gap:18px;margin-top:10px}
  .sub .cat{width:100%;max-width:none;flex-direction:row;flex-wrap:wrap;margin-top:0}
  .sub .cat .chips{flex-direction:row;justify-content:center}
    .sub-title{margin-left:4px}
  .panel{border-radius:32px;padding:20px 16px}
  .item{border-radius:20px}
  .detail{grid-template-columns:1fr}
  .desc{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    "The idea is to deploy a high-impact Negative Emissions Technology (NET) in the alpine region of Canton Uri by developing a right-sized, small-scale pyrolysis plant adapted to local biomass availability. The plant would convert underutilized regional biomass into durable biochar (enabling carbon removal certificates) while also producing dispatchable renewable electricity, a key advantage over intermittent sources such as solar and wind, especially during winter and at night.",
    "A central technical challenge is recovering and converting waste heat into electricity at small scale, which requires targeted engineering and development.",
    "The project’s benefits include permanent carbon storage in biochar, improved local soil quality through biochar application, renewable electricity generation when it is most needed, and valorization of biomass that is currently unused. The CDR Booster would support the project by enabling a robust feasibility study covering technical design, local feedstock potential, and implementation pathways."

  {
   "id": "capture-and-conversion-through-3d-printed-catalysts",

   "question": "How do we design and validate durable 3D-printed CO₂-converting catalytic structures that improve conversion performance and reduce catalyst footprint?",
   "description": [
    "3D-printed structures, with their high surface area and design flexibility, have shown great promise for carbon capture. However, their untapped potential lies in printing constructs made directly from CO₂-converting materials, providing the potential to not only anchor CO₂ but convert it!",
    "We aim to test the printability of CeO₂, a known CO₂ catalyst, using laser powder bed fusion. We will investigate its sinterability (novel), and investigate the influence of surface topographies as a co-catalyst for bio-based polyester synthesis (reduce reaction times, reduce CO₂ footprint) - a new approach to cut catalyst consumption.",

   "question": "How do we robustly quantify the net climate benefit and long-term carbon stability of macroalgae-based biochar pathways across the full value chain?",
   "description": [
    "We address climate change by transforming waste algae from Lake Zurich and regeneratively cultivated seaweed into biostimulants and durable biochar, closing nutrient loops and reducing reliance on synthetic fertilizers. Beneficiaries include local farmers, ecosystems, and the climate. We’ve now successfully pyrolyzed both lake and seaweed biomass—including post-biostimulant extraction residues—producing one of the first-ever macroalgae biochars.",
    "Early analysis shows promising long-term carbon stability compared to woody biochar. During the CDR Booster, we will focus on conducting a cradle-to-grave LCA to assess the net GHG benefit of our carbon removal pathway across the entire value chain. This is a crucial next step to validate the integrity and scalability of our solution.",
    "We work with Universität Hohenheim, Agroscope, WSL, and Empa, and aim to scale through additional Swiss lakes and cultivated seaweed, using open-source methods to inspire local and global climate action."

   "question": "How do we utilize agricultural by-products as carbon-storing insulation so that we can reduce the footprint of construction in Switzerland?",
   "description": [
    "Laine&Sens transforms raw wool into high-performance insulation. Wool is ~50% carbon (sequestering 1.8kg CO₂/kg). By integrating it into buildings, we lock this biogenic carbon for 50-100 years. Our bio-based material stores ~60 kg CO₂ per m³, offering a massive carbon sink compared to mineral alternatives.",
    "We utilize a unique multi-stream circular process. Instead of synthetic chemicals, we use other Swiss agricultural by-products (plant extracts, minerals) as raw inputs for our cleaning and treatment protocols.",
    "Our waterless, 100% natural treatment ensures fire-retardancy and moth-proofing without toxic additives. This bio-based synergy delays the carbon release of both wool and agri-waste for decades. At end-of-life, the material remains fully compostable or recyclable, ensuring a clean and closed-loop carbon cycle."

   "question": "How do we develop energy-efficient graphene membrane systems so that we can enable modular, scalable CO₂ capture from industrial exhaust streams?",
   "description": [
    "Carbon capture isn’t new and existing approaches (whether it be CCS, CCUS or DAC) have been a topic of interest for years. Our idea introduces a circular, modular capture system based on advanced graphene membranes.",
    "Separatic’s patented technology enables the precise engineering of graphene-based filters with tunable pore sizes, allowing highly selective separation of CO₂ from exhaust streams. This enables efficient capture, even at small and medium scales.",
    "A significant limitation of membrane filtration for flue gas is the need for high operating pressures (up to 20bar). By using a hybrid vacuum-compressor system, Separatic offers a solution which could drastically reduce energy consumption.",
    "Key challenges remain, including optimizing operating pressures, determining humidity effects, and balancing CAPEX and OPEX. These will be addressed through the Booster to design and deploy in a pilot-scale system."

   "question": "How do we use carbon revenue and agricultural residues to unlock affordable credit for smallholder farmers while generating high-quality, verifiable carbon removals?",
   "description": [
    "In the Amazon and across the Global South, smallholder farmers struggle to access affordable credit. Without collateral, they cannot obtain productive capital at the start of each harvest to invest in soil health, equipment, or sustainable practices.",
    "This financial constraint also prevents them from managing agricultural residues productively. In the Amazon’s açaí sector, for instance, about 90 % of the fruit mass is discarded or burned, releasing CO₂ and wasting a potential carbon sink. As a result, valuable biomass decomposes, farmers remain excluded from finance, and large-scale carbon removal potential stays untapped.",
    "By addressing this disconnect between bio-waste and credit, a solution can unlock immediate finance for farmers, de-risk lending for financial institutions, and supply high-quality carbon removals for carbon buyers - creating a virtuous cycle between rural finance, carbon markets, and climate impact."

   "question": "How do we improve the investment case for point-source carbon capture by making systems grid-responsive and reducing operating costs and revenue risk?",
   "description": [
    "SmartCapture tackles the main barrier to CDR creation from point-source carbon capture (CC): economics. CDR cost is in large proportion driven by electricity costs and associated emissions, yet capture today is planned and run as if these inputs were static. In reality, power prices and grid emissions fluctuate by the minute with demand and renewable output, creating an optimization gap.",
    "We ask a question: what if capture systems behaved like a smart grid resource? SmartCapture adds an energy management layer that makes CC market and grid responsive by adjusting capture rates and managing associated energy storage.",
    "We maximize capture and charge when power is clean and cheap, while discharging and reducing capture at peak prices. Built for waste-to-energy, cement, and bioenergy plants, we turn capture into a grid asset, decreasing capture costs, lowering emissions, producing more CDRs per ton CO2 captured, reducing renewables curtailment, and allowing revenues from ancillary markets."

   "question": "How do we robustly measure and verify the net CO₂ removal and storage of biochar-based construction materials within EPD and building LCA frameworks?",
   "description": [
    "Lifecycle assessments (LCAs) and Environmental Product Declarations (EPDs) are becoming ever more prevalent in the construction industry, driven by the increasing focus on embodied carbon. These will feed directly into sustainability certificates for construction projects and these same certificates will be a requirement from banks to finance the projects. The problem is that the materials used over the past 40 years, such as concrete and plastic, will not be compatible with the requirements of these certificates.",
    "Enter KohlenKraft, where our mission is to supply the construction industry with negacirculative materials. Negacirculative means that not only will our materials be CO2 negative during their production, but also increase their circularity indicator. We have achieved this through the use of biochar, a Negative Emissions Technology (NET).",
    "Our vision is to retire the CO2 credits with the biochar, negating the need for unreliable and untransparent CO2 credits and instead using the EPD framework to record the CO2 savings."

   "question": "How do we enable low-cost, continuous, and autonomous monitoring of geological CO₂ storage that robustly assesses geomechanical risk and meets ISO/EU regulatory requirements?",
   "description": [
    "Monitoring CO2 geological storage is a legal EU requirement, costing storage operators several millions a year and is currently labor-intensive. Moreover, existing techniques struggle to robustly assess the geomechanical risk of the storage reservoir as mandated by ISO standards and EU regulations. Such obstacles hinder the safe deployment of (BE)CCS worldwide.",
    "Storra pioneers a low-cost, continuous and autonomous monitoring solution for (BE)CCS. We leverage high-precision deformation measurements and perform innovative data-processing techniques to provide a software capable of inferring the evolving risk and fate of CO2 in the reservoir. Employing tilt-meters, fiber optics, and InSAR, Storra integrates them with advanced simulators for novel CCS monitoring.",

   "question": "How do we define clear, enforceable rules for carbon credit ownership and accounting in the construction sector so negative emissions can be credibly claimed?",
   "description": [
    "The construction industry currently faces significant uncertainty around carbon credit ownership and accounting methodologies. Product manufacturers, building owners, and other stakeholders lack clarity on who can claim carbon credits and through what method—whether product Lifecycle Assessments (LCAs), building LCAs (EN 15804, SIA 2032, SIA 390/1), or voluntary certificates. This ambiguity hinders the integration of negative emissions into business models and slows the construction sector's transition to sustainable practices.",
    "Our project will develop a framework to clarify credit attribution, working closely with public authorities and industry stakeholders, leveraging the new SIA 390/1 standard, which includes negative emissions in building LCAs for the first time. We also take a closer look on product LCAs and the European approach (EN 15804, EN 15978). Our project will focus on feasibility and collaboration with stakeholders throughout the CDR Booster process."

   "question": "How do we adapt policy and pricing mechanisms to differentiate CO₂ removals from CO₂ reductions so high-cost CDR becomes viable early enough to reach net zero by 2050?",
   "description": [
    "Projects for CO2 removal are in most cases more expensive than projects for CO2 reduction, i.e. the cost per ton of CO2 removed is higher than the cost per ton of CO2 reduced.",
    "The current political framework is mainly focused on CO2 reductions. As a result, there is often no price differentiation between CO2 reduction and CO2 removal. If projects for CO2 removal are assessed at the price level for CO2 reductions, they are rarely viable.",
    "At the same time, experts agree that CO2 removal projects must be launched today in order to reach net zero by 2050. Without a price differentiation between CO2 reductions and CO2 removal, CO2 removal projects are not viable and will not be realized."
   ],

   "question": "How do we develop a cost-competitive, standardized biochar-based growing medium for hydroponics that meets performance needs and can be credibly accounted for on the CDR market?",
   "description": [
    "Hydroponic cultivation uses unsustainable growing media for plant cultivation, e.g., rock-wool or mined peat. Although biochar has been tested in horticulture, it has has not entered the hydroponics market. Moreover, it suffers from 1) high cost; 2) variable types/quality of current biochar; 3) high alkalinity (pH).",
    "To solve that , we aim to: a) design Growchar (GC) that can fully replace existing growing media, using compounded biochar made from low-value biomass; b) make sure GC is valid on the CDR market; c) testing alkalinity neutralization by upfront reaction with carbonic acid (=CO2), generating additional carbon credits.",
    "GC will be tested using typical greenhouse cultivars. After use, GC can be mixed with compost for further use in agriculture, potentially furthering its economic value. Sale of CDR credits will lower the price of the GC making it economically competitive with current growing media. GC will help make the greenhouse sector more sustainable and carbon neutral."
   ],

   "question": "How do we enable small-to-medium emitters to pool captured CO₂ volumes via regional handling hubs so they can reduce costs, access disposal options, and comply with regulations?",
   "description": [
    "Although large emitters are indispensable to achieve the climate goals, small-to-medium emitters can and will contribute a significant share to emission reductions, will be a source of biogenic CO2 and thus of carbon credits.",
    "These emitters do not have a dedicated chain of completion and their contribution to CO2 emission reductions is only economically viable if they can pool volumes and build on bargaining power to minimize costs.",
    "The RCHH serves as a handling point and fulfils at least 3 key objectives: 1) Offtake of captured CO2 as a relief, 2) Resources can be bundled and used economically, 3) CO2 can be made available to all kind of buyers/disposals",
    "Key questions to be sorted out: 1) Is the RCHH-ecosystem viable? 2) Where should they be located? 3) Does the existing regulatory framework allow the disposal, handling as well as redistribution of CO2? These key questions have not yet been worked out and would be the focus of the work throughout the CDR Booster."

   "question": "How do we build informed public understanding and trust in geological CO₂ storage by making risks, evidence, and monitoring transparent and accessible?",
   "description": [
    "In Switzerland, even though a recent report on CCS (2020) set an annual target of 12 Mt CO2 stored by 2050, policies and regulations for upcoming pilot projects are still limited to a discussion level. Successful implementation of geological CO2 storage (GCS) will require long-term investments of subsurface characterization, risk, safety and public acceptance research.",
    "The latter, should be considered early on in the implementation chain, as past incidents with other subsurface technologies (e.g. induced seismicity) have shaped the public opinion in a skeptical way.",
    "INPLUGS-CO2 aims to contribute in to raising public awareness on the topic of GCS, its risks and urgency, through an interactive online platform shaped around an EPFL testbed and its digital twin developed to study GCS. Main principles, key findings and live results will be actively shared with the larger public in order to promote safe implementation of GCS and educational workshops will be organized throughout the year."

    "Recent research highlights that public engagement must move beyond acceptance studies towards genuine co-creation and dialogue (Low et al., Nature Communications, 2024). The CDR Experience Hub – Feasibility and Design Study addresses this gap by exploring how complex CDR processes can be made spatially, visually, and interactively tangible.",
    "The result is a transferable 3D concept and design prototype for a mobile exhibition that brings CDR knowledge directly to where people are – making it accessible, relatable, and locally relevant to support informed dialogue, participation, and scaling of high-quality CDR solutions in Switzerland and beyond."

   "question": "How do we introduce young people to CDR methods so that they build the understanding and acceptance needed to engage in future societal discourses on carbon removal?",
   "description": [
    "The Rucksackschule (Backpack School) has been running nature-based environmental education for over 30 years, including on the topic of climate. At our Climate Days, we would like to newly place a focus on the topic of CDR (Carbon Dioxide Removal).",
    "Planned events include activities as part of climate weeks, forest days for school classes, and experience days during children's school holidays in their free time. Participants are introduced to the topic of CDR in a playful, exploratory way: How does a tree extract CO2 from the air? How much CO2 does it store? How can we use this to do something about global warming?",
    "The plan is to produce biochar ourselves as a hands-on example, thereby demonstrating the connections between pyrolysis, biochar, and CO2 storage. Through our events, we want to increase public understanding and acceptance of CDR methods, as an educational and awareness-raising step to prepare society for discourses in the field of removal."

    "The Oceans have already captured 30% of all human CO2 emissions but the amount they can capture is reaching its current limit, and the absorption is having destructive impacts on the ocean ecosystems such as corals. By removing CO2 directly from the ocean and storing it underground, Direct Ocean Capture (DOC) can refresh the ocean CO2 sponge and minimize some of the impact of ocean acidification.",

   "question": "How do we reduce the energy demand of sorbent-based Direct Air Capture by enabling efficient desorption with Radiofrequency Heating?",
   "description": [
    "The energy consumption of Direct Air Capture (DAC) systems using sorbents is substantially driven by two subsystems, the active ventilation and the heating system for desorption. Each of these will have to be optimized energetically to achieve the CO2 capture cost goals.",
    "In this program, we want to show the feasibility and potential energy savings of desorption using dielectric heating with Radio Frequency (RF) energy. Desorption with electromagnetic energy has already been tried with microwaves but turned out to be complex and expensive to implement. RF uses a wavelength 100 times longer and therefore dramatically increases the design flexibility of the heating system. It can potentially heat much thicker layers of DAC sorbents in a volumetric manner with lowest losses.",
    "Our goal is to test different sorbents available at EMPA for their suitability for RF heating and get quantitative results on the potential energy savings compared to conventional desorption methods."

   "question": "How do we improve the durability, regeneration performance, and mechanical stability of K₂CO₃-based sorbents for efficient CO₂ capture at low-to-medium concentrations?",
   "description": [
    "Potassium carbonate (K₂CO₃) sorbents, as used in Mitico’s post-combustion CO₂ capture systems, efficiently absorb and release CO₂ with narrow temperature swings, yet suffer from water sensitivity, limited regeneration cycles, and poor mechanical stability.",
    "This project aims to enhance sorbent durability and kinetics by supporting K₂CO₃ on millimeter-sized nitrogen-doped activated carbon beads. Our idea of using larger, porous beads offer high surface area, improved heat transfer, and reduced attrition in packed-bed reactors.",
    "During the Booster, we will evaluate thermal stability and carbonation–decarbonation behavior using TGA/DSC, and assess microstructural and compositional evolution via SEM/EDS before and after CO₂ exposure. The innovation lies in coupling nitrogen-functionalized carbon supports with carbonate chemistry to produce a regenerable, thermally stable sorbent suitable for industrial CO₂ capture at low to medium concentrations."

   "question": "How do we reduce the need for CO₂ transport to permanent storage by converting captured CO₂ locally into stable solid carbon that can be safely stored or repurposed?",
   "description": [
    "Logistics for CO2 transport to a permanent storage location is a great challenge. Our Chemcarb technology, based on the use of liquid metals, can mitigate this problem by converting captured CO2 directly, efficiently, and locally into solid carbon. Unlike CO2, solid carbon can be safely stored domestically or can be easily repurposed.",
    "CO2 emitting industries that need to reduce their carbon footprint will benefit, especially those located in isolated areas where CO2 transport to a pipeline is costly.",
    "No commercial product exists to convert CO2 to carbon directly. We tested and validated that our novel liquid metal alloy composition converts CO2 into solid carbon in a single step. Compared to the state-of-the-art research, our material has lower melting point allowing for low reaction temperatures.",
    "With the CDR Booster we plan to: 1) Improve reactor design, 2) Perform techno-economic analysis to verify market competitiveness, 3) Evaluate processes to isolate high quality carbon."

   "question": "How do we enable rapid, on-site CO₂ purity verification for batch transport (truck/rail/barge) to reduce delays, buffer storage needs, and liability risks?",
   "description": [
    "Usage, conversion or storage in CCUS/BECCS projects prescribe CO2 purity levels, which are also defined by transport operators as well as e.g., by processes such as liquefaction. Reaching and maintaining the purity levels poses a major challenge to capture and liquefaction units. Verification and purity proof to be provided are also challenging, due to the contaminants list and the limits. Currently the proof can only be provided by costly and time-dependent laboratory analyses.",
    "In a continuous process using e.g., pipelines, no problem. With batch deliveries (barges, train or truck), in order to provide assurance, reduce risk exposure and avoid liability cases, the process would require costly buffer storages to achieve certainty before you convey.",
    "The solution aims at in-situ, on-site testing of CO2 purity in order to save time, ensure a continuous conveyance process and provide purity proof of the conveyed CO2."

   "question": "How do we store low-lignin biomass side-streams long term so that we can unlock a scalable, low cost, and globally deployable CDR?",
   "description": [
    "Our idea is to experimentally validate a novel CDR pathway based on Biomass Carbon Removal and Storage (BiCRS) using low lignin biomass such as microalgae, digestate from biogas plants, dried grass or hay, agricultural residues (e.g., straw or crop residues), and other low lignin organic side streams.",
    "The project will construct and monitor pilot biomass storage cells (above ground) that maintain dry and anoxic conditions using different sealing systems well known from landfill engineering. By comparing natural clay barriers, geosynthetic bentonite liners, and HDPE geomembranes under real environmental conditions, we will identify which systems best prevent water ingress, O2 diffusion, and biomass degradation. Continuous monitoring of gases, moisture, and temperature will allow us to quantify stability and potential emissions.",
    "The innovation lies in demonstrating that even biologically labile biomass can be stored long term with minimal technology, potentially unlocking a scalable, low cost, and globally deployable CDR solution."

   "question": "How do we develop mycelium-based insulation materials so that buildings can function as active carbon storage systems?",
   "description": [
    "MycoTherm develops insulation materials from mycelium and biogenic residues that can be used in building envelopes and interior applications. Instead of only reducing emissions, the idea is to use these materials as temporary carbon sinks by storing atmospheric carbon captured through biomass in buildings.",

  {name:"Capture", icon:"aperture", group:"chain"},
  {name:"Transport", icon:"truck", group:"chain"},
  {name:"Storage", icon:"mountain", group:"chain"},
  {name:"Science & technology", icon:"flask-conical", group:"l"},
  {name:"Investments", icon:"coins", group:"l"},
  {name:"Community Engagement", icon:"users", group:"r"},
  {name:"Market", icon:"bar-chart-3", group:"r"},
  {name:"MRV", icon:"clipboard-check", group:"b"},
  {name:"Human capital", icon:"presentation", group:"b"},

];

/* ===================== helpers ===================== */
const ICONS = {"aperture": "<circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"m14.31 8 5.74 9.94\" /> <path d=\"M9.69 8h11.48\" /> <path d=\"m7.38 12 5.74-9.94\" /> <path d=\"M9.69 16 3.95 6.06\" /> <path d=\"M14.31 16H2.83\" /> <path d=\"m16.62 12-5.74 9.94\" />", "truck": "<path d=\"M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2\" /> <path d=\"M15 18H9\" /> <path d=\"M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14\" /> <circle cx=\"17\" cy=\"18\" r=\"2\" /> <circle cx=\"7\" cy=\"18\" r=\"2\" />", "mountain": "<path d=\"m8 3 4 8 5-5 5 15H2L8 3z\" />", "flask-conical": "<path d=\"M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2\" /> <path d=\"M8.5 2h7\" /> <path d=\"M7 16h10\" />", "coins": "<circle cx=\"8\" cy=\"8\" r=\"6\" /> <path d=\"M18.09 10.37A6 6 0 1 1 10.34 18\" /> <path d=\"M7 6h1v4\" /> <path d=\"m16.71 13.88.7.71-2.82 2.82\" />", "users": "<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\" /> <circle cx=\"9\" cy=\"7\" r=\"4\" /> <path d=\"M22 21v-2a4 4 0 0 0-3-3.87\" /> <path d=\"M16 3.13a4 4 0 0 1 0 7.75\" />", "bar-chart-3": "<path d=\"M3 3v18h18\" /> <path d=\"M18 17V9\" /> <path d=\"M13 17V5\" /> <path d=\"M8 17v-3\" />", "clipboard-check": "<rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\" ry=\"1\" /> <path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\" /> <path d=\"m9 14 2 2 4-4\" />", "presentation": "<path d=\"M2 3h20\" /> <path d=\"M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3\" /> <path d=\"m7 21 5-5 5 5\" />", "gavel": "<path d=\"m14.5 12.5-8 8a2.119 2.119 0 1 1-3-3l8-8\" /> <path d=\"m16 16 6-6\" /> <path d=\"m8 8 6-6\" /> <path d=\"m9 7 8 8\" /> <path d=\"m21 11-8-8\" />", "lightbulb": "<path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\" /> <path d=\"M9 18h6\" /> <path d=\"M10 22h4\" />", "home": "<path d=\"m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\" /> <polyline points=\"9 22 9 12 15 12 15 22\" />", "chevron-right": "<path d=\"m9 18 6-6-6-6\" />", "link": "<path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\" /> <path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\" />", "arrow-left": "<path d=\"m12 19-7-7 7-7\" /> <path d=\"M19 12H5\" />"};
const icon = n => `<svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||""}</svg>`;

const slug = s => s.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
const esc = s => (s||"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const catBySlug = s => CATEGORIES.find(c=>slug(c.name)===s);
const ideasIn = c => DATA.ideas.filter(i=>i.category===c);
const chIn = c => DATA.challenges.filter(i=>i.category===c);
const app = document.getElementById("app");

function chips(c, active){
  const s = slug(c.name);
  return `<div class="chips">
    <a class="chip ch ${active==="challenges"?"on":""}" href="#/${s}/challenges" aria-label="${esc(c.name)} challenges"><span class="q" aria-hidden="true">?</span>Challenges<span class="n">${chIn(c.name).length}</span></a>
    <a class="chip idea ${active==="ideas"?"on":""}" href="#/${s}/ideas" aria-label="${esc(c.name)} funded ideas">${icon("lightbulb")}Ideas<span class="n">${ideasIn(c.name).length}</span></a>
  </div>`;
}
function catCard(c, active, withMarker){
  return `<div class="cat">${withMarker?`<span class="marker" aria-hidden="true">${icon(c.icon)}</span>`:""}
    <h2>${icon(c.icon)}${esc(c.name)}</h2>${chips(c,active)}</div>`;
}

/* ===================== views ===================== */
function overview(){
  const g = k => CATEGORIES.filter(c=>c.group===k);
  app.innerHTML = `
  <h1>Swiss CDR Ecosystem: <span class="accent">Challenges and Ideas Archive</span></h1>
  <section class="env" aria-label="Enabling environment">
    <p class="ring">enabling environment</p>
    <div class="ov">
      <div class="side l">${g("l").map(c=>catCard(c)).join("")}</div>
      <div class="chain" aria-label="Operational supply chain">
        <div class="chain-row"><div class="arrow" aria-hidden="true"></div>${g("chain").map(c=>catCard(c,null,true)).join("")}</div>
        <p class="ring" style="margin:12px 0 4px">operational supply chain</p>
      </div>
      <div class="side r">${g("r").map(c=>catCard(c)).join("")}</div>
      <div class="bottom">${g("b").map(c=>catCard(c)).join("")}</div>
    </div>
  </section>`;
}

function listView(c, kind){
  const isIdea = kind==="ideas";
  const s = slug(c.name);
  const items = isIdea ? ideasIn(c.name) : chIn(c.name);
  const list = items.length ? `<ol class="list">${items.map((it,i)=> isIdea
      ? `<li><a class="item idea" href="#/${s}/ideas/${esc(it.id)}">${icon("lightbulb")}<span>${it.num??i+1}. ${esc(it.title)}</span><span class="go">${icon("chevron-right")}</span></a></li>`
      : `<li class="item ch"><span class="q" aria-hidden="true">?</span><span>${it.num??i+1}. ${bold(it.text)}</span></li>`).join("")}</ol>`
    : `<p class="empty">No ${isIdea?"funded ideas":"challenges"} in ${esc(c.name)} yet.</p>`;
  app.innerHTML = `
  <div class="sub">
    ${catCard(c, kind)}
    <div class="panel-wrap">
      <h1 class="sub-title ${isIdea?"idea":"ch"}" style="text-align:left">Explore the <span>${isIdea?"funded ideas":"challenges"}</span></h1>
      <div class="panel">${list}</div>
    </div>
  </div>`;
}

function ideaView(c, idea){
  const s = slug(c.name);
  const n = idea.num ?? ideasIn(c.name).indexOf(idea)+1;
  const contact = [
    idea.contactName ? esc(idea.contactName) : "",
    idea.contactEmail ? `<a href="mailto:${esc(idea.contactEmail)}">${esc(idea.contactEmail)}</a>` : ""
  ].filter(Boolean).join("<br>");
  const linkIcon = idea.link ? `<a class="weblink" href="${esc(idea.link)}" target="_blank" rel="noopener" aria-label="Project website">${icon("link")}</a>` : "";
  app.innerHTML = `
  <div class="detail">
    <h1 class="d-title${idea.title.length>55?" long":""}">${icon("lightbulb")}${n}. ${esc(idea.title)}</h1>
    <div>
      <div class="d-meta">
        <span class="cohort">${icon("users")}${esc(idea.cohort)}</span>
        <a class="cat-pill" href="#/${s}/ideas">${icon(c.icon)}${esc(c.name)}</a>
      </div>
      <div class="qcard">
        <div class="tags">${(idea.topics||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
        <p class="question">${esc(idea.question)}</p>
        <div class="team">
          ${idea.logo?`<img src="${idea.logo}" alt="${esc(idea.title)} team logo">`:""}
          <div class="who">${linkIcon}${contact}</div>
        </div>
      </div>
      <a class="back" href="#/${s}/ideas">${icon("arrow-left")}All funded ideas in ${esc(c.name)}</a>
    </div>
    <div class="desc">${idea.description.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
  </div>`;
}

/* ===================== router ===================== */
function route(){
  const parts = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  const c = parts[0] && catBySlug(parts[0]);
  document.getElementById("home").hidden = !c;
  if(!c){ overview(); }
  else if(parts[1]==="ideas" && parts[2]){
    const idea = ideasIn(c.name).find(i=>i.id===parts[2]);
    idea ? ideaView(c, idea) : listView(c,"ideas");
  }
  else listView(c, parts[1]==="challenges"?"challenges":"ideas");
  window.scrollTo(0,0);
  const h = app.querySelector("h1"); if(h){ h.setAttribute("tabindex","-1"); if(c) h.focus({preventScroll:true}); }
}
addEventListener("hashchange", route);
route();
</script>
